<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QXTerminal Logo (Static)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .logo-container {
    width: 300px;
    height: 300px;
  }
  .logo-container svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }
</style>
</head>
<body>

<div class="logo-container">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#00d2ff"/>
        <stop offset="40%" style="stop-color:#0099cc"/>
        <stop offset="100%" style="stop-color:#00f0ff"/>
      </linearGradient>
      <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#09111f"/>
        <stop offset="50%" style="stop-color:#000"/>
        <stop offset="100%" style="stop-color:#070d18"/>
      </linearGradient>
      <clipPath id="hexagonClip">
        <path d="M100 15 L160 50 L160 120 L100 155 L40 120 L40 50 Z"/>
      </clipPath>
    </defs>

    <!-- خلفية السداسي -->
    <path d="M100 15 L160 50 L160 120 L100 155 L40 120 L40 50 Z" fill="#000"/>

    <!-- الأعمدة داخل السداسي -->
    <g clip-path="url(#hexagonClip)">
      <rect x="65" y="110" width="18" height="50" rx="2" fill="#000" stroke="url(#cyanGrad)" stroke-width="2" stroke-linejoin="round" transform="scale(1)" style="transform-origin: bottom; opacity: 1;"/>
      <rect x="91" y="85" width="18" height="75" rx="2" fill="#000" stroke="url(#cyanGrad)" stroke-width="2" stroke-linejoin="round" transform="scale(1)" style="transform-origin: bottom; opacity: 1;"/>
      <rect x="117" y="60" width="18" height="100" rx="2" fill="#000" stroke="url(#cyanGrad)" stroke-width="2" stroke-linejoin="round" transform="scale(1)" style="transform-origin: bottom; opacity: 1;"/>
    </g>

    <!-- حدود السداسي الخارجية -->
    <path d="M100 15 L160 50 L160 120 L100 155 L40 120 L40 50 Z"
          fill="none" stroke="url(#cyanGrad)" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- الخط الداخلي للسداسي -->
    <path d="M100 15 L160 50 L160 120 L100 155 L40 120 L40 50 Z"
          fill="none" stroke="url(#blueGrad)" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- مسار السهم -->
    <path d="M35 125 L75 90 L100 105 L165 45"
          fill="none" stroke="url(#cyanGrad)" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 125 L75 90 L100 105 L165 45"
          fill="none" stroke="#000" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- رأس السهم -->
    <g transform="translate(165,45) rotate(-42.7)">
      <path d="M-25 -15 L12 0 L-25 15 Z"
            fill="#000" stroke="#00d2ff" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </svg>
</div>

</body>
</html>
